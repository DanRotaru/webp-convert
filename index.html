<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebP Converter — Free Bulk Image Converter &amp; Resizer</title>
    <meta name="description" content="Convert JPG, PNG, GIF &amp; 4+ image formats to WebP and bulk-resize images—100% free, no uploads, instant results.">
    <meta name="theme-color" content="#181d2c">
    <script>
      // Apply the saved theme before first paint to avoid a flash
      try {
        if (localStorage.getItem('webp-theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- JSZip + FileSaver globals (same util.js as the original app) -->
    <script src="/assets/util.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
